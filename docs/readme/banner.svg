<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Regression Radar: know what breaks before you upgrade">
<title>Regression Radar: know what breaks before you upgrade</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}

/* The sweep turns once every 4s; each blip lights up as the beam passes it. */
.sweep{transform-box:view-box;transform-origin:250px 200px;animation:sweep 4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}

.blip{opacity:.9;animation:blip 4s linear infinite}
@keyframes blip{0%{opacity:1}55%{opacity:.18}100%{opacity:.18}}

.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 4s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:.85}40%{transform:scale(2.6);opacity:0}100%{transform:scale(2.6);opacity:0}}

/* Two tinted glows cross-fade, so the background slowly shifts colour. */
.glowA{animation:fadeA 10s ease-in-out infinite alternate}
.glowB{opacity:0;animation:fadeB 10s ease-in-out infinite alternate}
@keyframes fadeA{from{opacity:1}to{opacity:.15}}
@keyframes fadeB{from{opacity:0}to{opacity:1}}

.title{animation:rise .9s ease-out both}
.sub{animation:rise .9s .15s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
  .sweep,.blip,.ring,.glowA,.glowB,.title,.sub{animation:none}
  .ring{opacity:0}
}
</style>

<defs>
  <radialGradient id="tintGreen" cx="260" cy="200" r="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3fb950" stop-opacity=".16"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="tintBlue" cx="900" cy="120" r="620" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#388bfd" stop-opacity=".14"/>
    <stop offset="1" stop-color="#388bfd" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wedge" gradientUnits="userSpaceOnUse" x1="364.8" y1="210" x2="289.2" y2="85.2">
    <stop offset="0" stop-color="#7ee787" stop-opacity=".38"/>
    <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e6edf3"/>
    <stop offset="1" stop-color="#aff5b4"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#21262d"/>
  </pattern>
  <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
</defs>

<g clip-path="url(#frame)">
  <rect width="1200" height="400" fill="#0d1117"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect class="glowA" width="1200" height="400" fill="url(#tintGreen)"/>
  <rect class="glowB" width="1200" height="400" fill="url(#tintBlue)"/>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="23.5" fill="none" stroke="#30363d"/>

<!-- Radar -->
<g transform="translate(250 200)">
  <circle r="140" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle r="93" fill="none" stroke="#30363d" stroke-width="1.2"/>
  <circle r="46" fill="none" stroke="#21262d" stroke-width="1.2"/>
  <line x1="-140" x2="140" stroke="#21262d" stroke-width="1.2"/>
  <line y1="-140" y2="140" stroke="#21262d" stroke-width="1.2"/>
</g>
<g class="sweep">
  <path d="M250 200 L390 200 A140 140 0 0 0 320 78.76 Z" fill="url(#wedge)"/>
  <line x1="250" y1="200" x2="390" y2="200" stroke="#7ee787" stroke-width="2.2" stroke-linecap="round"/>
</g>
<circle cx="250" cy="200" r="4" fill="#e6edf3"/>

<!--
  Blips. Green = a regression that is fixed, amber = still open: the same two
  statuses the app stamps from GitHub. Delay = -4s * (1 - angle/360), so each
  one flashes exactly when the beam reaches it.
-->
<!-- 30deg, r110 -->
<circle class="ring" cx="345.26" cy="255" r="6" fill="none" stroke="#3fb950" stroke-width="1.5" style="animation-delay:-3.667s"/>
<circle class="blip" cx="345.26" cy="255" r="5.5" fill="#3fb950" style="animation-delay:-3.667s"/>
<!-- 115deg, r72 -->
<circle class="ring" cx="219.57" cy="265.25" r="6" fill="none" stroke="#d29922" stroke-width="1.5" style="animation-delay:-2.722s"/>
<circle class="blip" cx="219.57" cy="265.25" r="5.5" fill="#d29922" style="animation-delay:-2.722s"/>
<!-- 200deg, r118 -->
<circle class="ring" cx="139.12" cy="159.64" r="6" fill="none" stroke="#3fb950" stroke-width="1.5" style="animation-delay:-1.778s"/>
<circle class="blip" cx="139.12" cy="159.64" r="5.5" fill="#3fb950" style="animation-delay:-1.778s"/>
<!-- 250deg, r60 -->
<circle class="ring" cx="229.48" cy="143.62" r="6" fill="none" stroke="#3fb950" stroke-width="1.5" style="animation-delay:-1.222s"/>
<circle class="blip" cx="229.48" cy="143.62" r="5" fill="#3fb950" style="animation-delay:-1.222s"/>
<!-- 300deg, r112 -->
<circle class="ring" cx="306" cy="103" r="6" fill="none" stroke="#d29922" stroke-width="1.5" style="animation-delay:-0.667s"/>
<circle class="blip" cx="306" cy="103" r="5.5" fill="#d29922" style="animation-delay:-0.667s"/>

<!-- Wordmark -->
<g class="sub">
  <text x="480" y="150" font-size="15" font-weight="700" letter-spacing="3" fill="#7d8590">UPGRADE RISK, FROM MEMORY</text>
</g>
<g class="title">
  <text x="478" y="216" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#titleFill)">Regression Radar</text>
</g>
<g class="sub">
  <text x="480" y="262" font-size="27" fill="#8b949e">Know what breaks before you upgrade.</text>
  <text x="480" y="310" class="mono" font-size="15" fill="#6e7681">real GitHub issues  ·  every citation checked  ·  learns from each upgrade</text>
  <circle cx="486" cy="343" r="5" fill="#3fb950"/>
  <text x="498" y="348" class="mono" font-size="14" fill="#8b949e">fixed</text>
  <circle cx="566" cy="343" r="5" fill="#d29922"/>
  <text x="578" y="348" class="mono" font-size="14" fill="#8b949e">still open</text>
  <text x="680" y="348" class="mono" font-size="14" fill="#6e7681">status stamped from GitHub, never guessed</text>
</g>
</svg>
