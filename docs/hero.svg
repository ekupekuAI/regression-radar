<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Regression Radar: know what breaks before you upgrade">
<title>Regression Radar: know what breaks before you upgrade</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.rip{transform-box:fill-box;transform-origin:center}

</style>

<defs>
  <radialGradient id="glow" cx="250" cy="200" r="300" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wedge" gradientUnits="userSpaceOnUse" x1="114.8" y1="10" x2="39.2" y2="-114.8">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#21262d"/>
  </pattern>
</defs>
<rect width="1200" height="400" rx="24" fill="#0d1117"/>
<rect width="1200" height="400" rx="24" fill="url(#dots)"/>
<rect width="1200" height="400" rx="24" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="399" rx="23.5" fill="none" stroke="#30363d"/>

<g transform="translate(250 200)">
  <circle r="140" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <circle r="88" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <line x1="-140" x2="140" stroke="#21262d" stroke-width="1.2"/>
  <line y1="-140" y2="140" stroke="#21262d" stroke-width="1.2"/>
  <g>
    <path d="M0 0 L140 0 A140 140 0 0 0 70.00 -121.24 Z" fill="url(#wedge)"/>
    <line x2="140" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
  </g>
  <circle r="4" fill="#ffffff"/>
</g>

<circle cx="338.74" cy="268.34" r="22" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0">
  <animate attributeName="r" values="5;5;26;26" keyTimes="0;0.1044;0.45;1" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0;.7;0;0" keyTimes="0;0.1044;0.1104;0.45;1" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="338.74" cy="268.34" r="6" fill="#ffffff">
  <animate attributeName="opacity" values=".3;.3;1;.3;.3" keyTimes="0;0.1044;0.1104;0.6;1" dur="4s" repeatCount="indefinite"/>
</circle>

<text x="480" y="168" font-size="15" font-weight="700" letter-spacing="3" fill="#6e7681">UPGRADE RISK, FROM MEMORY</text>
<text x="478" y="232" font-size="68" font-weight="800" letter-spacing="-2" fill="#e6edf3">Regression Radar</text>
<text x="480" y="278" font-size="27" fill="#8b949e">Know what breaks before you upgrade.</text>
<text x="480" y="326" class="mono" font-size="16" fill="#6e7681">98 real GitHub issues  ·  every citation checked  ·  learns from each upgrade</text>

</svg>
